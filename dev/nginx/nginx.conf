server {
    listen 80;

    # Longest matching prefix wins, so this takes precedence over /api/.
    # The trailing slash on proxy_pass strips /api/chat/, leaving the
    # service's own paths (/threads/{id}/messages) untouched.
    location /api/chat/ {
        proxy_pass http://duly-chat-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A turn makes two model calls, so it can outlast the default 60s.
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://duly-backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://duly-frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # required for Vite HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
