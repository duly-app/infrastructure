name: note-taking-app

services:
  duly-nginx:
    container_name: dev-duly-nginx
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    networks:
      - dev-network-external
      - dev-network-internal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - duly-backend
      - duly-chat-backend
      - duly-frontend

  duly-migrate:
    container_name: dev-duly-migrate
    build:
      context: ${DULY_BACKEND_PATH:-../../duly-backend}
      dockerfile: Dockerfile
      target: dev
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"
    networks:
      - dev-network-internal
    env_file:
      - ${DULY_BACKEND_PATH:-../../duly-backend}/.env.dev
    volumes:
      - ${DULY_BACKEND_PATH:-../../duly-backend}/migrations:/app/migrations
    depends_on:
      duly-postgres:
        condition: service_healthy

  duly-backend:
    container_name: dev-duly-backend
    user: "${UID:-1002}:${GID:-1002}"
    build:
      context: ${DULY_BACKEND_PATH:-../../duly-backend}
      dockerfile: Dockerfile
      target: dev
    networks:
      - dev-network-internal
    env_file:
      - ${DULY_BACKEND_PATH:-../../duly-backend}/.env.dev
    environment:
      DEBUG_METRICS: "1"
    volumes:
      - ${DULY_BACKEND_PATH:-../../duly-backend}/src:/app/src
    depends_on:
      duly-migrate:
        condition: service_completed_successfully

  embedder-qa:
    container_name: dev-embedder-qa
    build:
      context: ${EMBEDDER_QA_PATH:-../../embedder-qa}
      dockerfile: Dockerfile
      target: dev
    networks:
      - dev-network-internal
    env_file:
      - ${EMBEDDER_QA_PATH:-../../embedder-qa}/.env.dev
    environment:
      MODEL_THREADS: "1"
    volumes:
      - ${EMBEDDER_QA_PATH:-../../embedder-qa}/src:/app/src

  duly-chat-backend:
    container_name: dev-duly-chat-backend
    build:
      context: ${DULY_CHAT_BACKEND_PATH:-../../duly-chat-backend}
      dockerfile: Dockerfile
      target: dev
    networks:
      - dev-network-internal
      # Unlike the other services, this one calls out to the Anthropic API,
      - dev-network-egress
    env_file:
      - ${DULY_CHAT_BACKEND_PATH:-../../duly-chat-backend}/.env.dev
    volumes:
      - ${DULY_CHAT_BACKEND_PATH:-../../duly-chat-backend}/src:/app/src
    depends_on:
      - duly-backend

  duly-frontend:
    container_name: dev-duly-frontend
    build:
      context: ${DULY_FRONTEND_PATH:-../../duly-frontend}
      dockerfile: Dockerfile
      target: dev
    networks:
      - dev-network-internal
    volumes:
      - ${DULY_FRONTEND_PATH:-../../duly-frontend}/src:/app/src

  loki:
    container_name: dev-loki
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    networks:
      - dev-network-observability
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    container_name: dev-alloy
    image: grafana/alloy:v1.20.1
    user: root
    ports:
      - "127.0.0.1:12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - dev-network-observability
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  prometheus:
    container_name: dev-prometheus
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks:
      - dev-network-observability
      - dev-network-internal
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    container_name: dev-grafana
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Dev only: skips the login screen entirely.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    networks:
      - dev-network-observability
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  duly-postgres:
    container_name: dev-duly-postgres
    image: pgvector/pgvector:pg16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - dev-network-internal
      - dev-network-db
    env_file:
      - ${DULY_BACKEND_PATH:-../../duly-backend}/.env.dev
    volumes:
      - duly-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  duly-postgres-data:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:

networks:
  dev-network-internal:
    driver: bridge
    internal: true
  dev-network-db:
    driver: bridge
  dev-network-egress:
    driver: bridge
  dev-network-observability:
    driver: bridge
  dev-network-external:
    driver: bridge