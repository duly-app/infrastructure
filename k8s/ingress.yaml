apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duly
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: duly-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: duly-frontend
            port:
              number: 80
