apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: duly-postgres
  labels:
    app: duly
    component: postgres
    tier: database
spec:
  serviceName: "duly-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: duly
      component: postgres
      tier: database
  template:
    metadata:
      labels:
        app: duly
        component: postgres
        tier: database
    spec:
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      containers:
        - name: duly-postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres-port
              protocol: TCP
          envFrom:
            - configMapRef:
                name: duly-postgres-config
            - secretRef:
                name: duly-postgres-secret
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pg_isready -U $POSTGRES_USER"
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pg_isready -U $POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata