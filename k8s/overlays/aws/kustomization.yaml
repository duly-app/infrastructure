apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: duly

resources:
  - ../../base
  - middleware.yaml

images:
  - name: duly-backend
    newName: ghcr.io/duly-app/duly-backend
    newTag: demo
  - name: duly-chatbot
    newName: ghcr.io/duly-app/duly-chatbot
    newTag: demo
  - name: duly-frontend
    newName: ghcr.io/duly-app/duly-frontend
    newTag: demo
  - name: duly-embedder-qa
    newName: ghcr.io/duly-app/duly-embedder-qa
    newTag: demo

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # k3s ships Traefik rather than ingress-nginx. Hits both Ingresses.
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik

  # Traefik ignores the nginx rewrite annotations entirely, so the chatbot
  # would receive /api/chat/threads/... unstripped and answer 404. Swap them
  # for a middleware reference, and drop the regex path, which only existed
  # because ingress-nginx needed capture groups.
  # A "/" inside a JSON Pointer key is escaped as ~1.
  - target:
      kind: Ingress
      name: duly-chatbot
    patch: |-
      - op: remove
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1use-regex
      - op: remove
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1rewrite-target
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: duly-strip-api-chat@kubernetescrd
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /api/chat
      - op: replace
        path: /spec/rules/0/http/paths/0/pathType
        value: Prefix

secretGenerator:
  - name: duly-backend-secret
    behavior: replace
    envs:
      - secrets/backend.env
  - name: duly-chatbot-secret
    behavior: replace
    envs:
      - secrets/chatbot.env
  - name: duly-embedder-qa-secret
    behavior: replace
    envs:
      - secrets/embedder.env
  - name: duly-postgres-secret
    behavior: replace
    envs:
      - secrets/postgres.env

generatorOptions:
  disableNameSuffixHash: true
