apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duly-chatbot
  labels:
    app: duly
    component: chatbot
    tier: backend
  # Its own Ingress, because rewrite-target applies to every rule here
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # $2 is everything after /api/chat
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/chat(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: duly-chatbot
                port:
                  number: 8000
